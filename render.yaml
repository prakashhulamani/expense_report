services:
  - type: web
    name: expense-tracker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon/Supabase Postgres connection string in the Render dashboard
